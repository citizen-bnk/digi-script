services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digiscript
      POSTGRES_PASSWORD: digiscript
      POSTGRES_DB: digiscript
    ports:
      - "5432:5432"
    volumes:
      - digiscript_postgres_data:/var/lib/postgresql/data

volumes:
  digiscript_postgres_data:
